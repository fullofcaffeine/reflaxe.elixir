version: 2

# Automatic update PRs stay disabled intentionally. The owner and monthly,
# pre-release review process live in docs/10-contributing/DEPENDENCY_MAINTENANCE.md.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/examples/todo-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "mix"
    directory: "/examples/todo-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "mix"
    directory: "/examples/03-phoenix-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
