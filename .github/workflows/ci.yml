name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  HAXE_VERSION: '4.3.7'
  ELIXIR_VERSION: '1.18.3'
  OTP_VERSION: '27.2'

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.21.2"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run gitleaks (all history)
        run: |
          set -euo pipefail
          gitleaks detect --source . --config .gitleaks.toml --redact --log-opts="--all"

  guards:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep (rg)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          # `npm ci --ignore-scripts` skips postinstall; fetch the toolchain explicitly (incl. neko).
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Install Haxe formatter
        run: |
          set -euo pipefail
          if ! haxelib run formatter --help >/dev/null 2>&1; then
            haxelib install formatter --quiet || haxelib install formatter
          fi
          haxelib run formatter --help >/dev/null
      - name: Run guardrails
        run: npm run ci:guards

  repo-hygiene:
    name: Repo Hygiene (dead-code audit)
    runs-on: ubuntu-latest
    needs: [guards]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep (rg)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Run dead-code audit (JSON)
        run: |
          set -euo pipefail
          scripts/repo-dead-code-audit.sh --scope src --limit 200 --json > dead-code-audit.json
          python3 scripts/ci/repo-hygiene-check.py --in dead-code-audit.json --out hygiene-summary.md
      - name: Upload dead-code audit report
        uses: actions/upload-artifact@v4
        with:
          name: dead-code-audit
          path: |
            dead-code-audit.json
            hygiene-summary.md
          retention-days: 7
      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          cat hygiene-summary.md >> "$GITHUB_STEP_SUMMARY" || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [guards]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.mix
            ~/.hex
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          # `npm ci --ignore-scripts` skips postinstall; fetch the toolchain explicitly (incl. neko).
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Run full test suite
        run: npm test

  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: [guards]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          # `npm ci --ignore-scripts` skips postinstall; fetch the toolchain explicitly (incl. neko).
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Compile-check examples
        run: npm run test:examples

  examples-elixir:
    name: Examples (Elixir WAE) / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [guards]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep shards small so first-run (cold) Mix compiles don't exceed job timeouts.
          - shard: mix-01
            only: '01-simple-modules'
            cache_paths: |
              examples/01-simple-modules/deps
              examples/01-simple-modules/_build
          - shard: mix-02
            only: '02-mix-project'
            cache_paths: |
              examples/02-mix-project/deps
              examples/02-mix-project/_build
          - shard: mix-03
            only: '03-phoenix-app'
            cache_paths: |
              examples/03-phoenix-app/deps
              examples/03-phoenix-app/_build
          - shard: mix-04
            only: '04-ecto-migrations'
            cache_paths: |
              examples/04-ecto-migrations/deps
              examples/04-ecto-migrations/_build
          - shard: mix-05
            only: '05-heex-templates'
            cache_paths: |
              examples/05-heex-templates/deps
              examples/05-heex-templates/_build
          - shard: mix-06
            only: '06-user-management'
            cache_paths: |
              examples/06-user-management/deps
              examples/06-user-management/_build
          - shard: mix-07
            only: '07-protocols'
            cache_paths: |
              examples/07-protocols/deps
              examples/07-protocols/_build
          - shard: mix-08
            only: '08-behaviors'
            cache_paths: |
              examples/08-behaviors/deps
              examples/08-behaviors/_build
          - shard: mix-09
            only: '09-phoenix-router'
            cache_paths: |
              examples/09-phoenix-router/deps
              examples/09-phoenix-router/_build
          - shard: mix-10
            only: '10-option-patterns'
            cache_paths: |
              examples/10-option-patterns/deps
              examples/10-option-patterns/_build
          - shard: mix-11
            only: '11-domain-validation'
            cache_paths: |
              examples/11-domain-validation/deps
              examples/11-domain-validation/_build
    timeout-minutes: 90
    env:
      TIMEOUT_DEPS_GET: '600'
      TIMEOUT_DEPS_COMPILE: '1200'
      TIMEOUT_MIX_COMPILE: '1800'
      TIMEOUT_HAXE_BUILD: '600'
      TIMEOUT_ELIXIRC: '600'
      # Keep this job focused and bounded. Heavy end-to-end apps are covered by dedicated workflows.
      # - todo-app: covered by `.github/workflows/sentinel.yml` (QA sentinel + Playwright)
      # - test-integration: covered by full `CI / Tests`
      # - lix-installation: covered by docs + install guides; compile-check is covered in `Examples` job
      EXAMPLES_ELIXIR_WAE_SKIP: 'todo-app test-integration lix-installation'
      EXAMPLES_ELIXIR_WAE_ONLY: ${{ matrix.only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Cache Hex/Mix (reduce deps.get flakiness)
        uses: actions/cache@v4
        with:
          path: |
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-mix-hex-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-hex-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - name: Cache example deps/_build (speed up WAE shards)
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_paths }}
          key: ${{ runner.os }}-examples-elixir-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ matrix.shard }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-examples-elixir-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ matrix.shard }}-
            ${{ runner.os }}-examples-elixir-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          # `npm ci --ignore-scripts` skips postinstall; fetch the toolchain explicitly (incl. neko).
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Validate examples Elixir (warnings as errors)
        run: npm run test:examples-elixir
      - name: Upload examples-elixir logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: examples-elixir-wae-logs-${{ matrix.shard }}
          path: _tmp/examples-elixir-wae

  budgets:
    name: Budgets (perf + determinism)
    runs-on: ubuntu-latest
    needs: [guards]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          # `npm ci --ignore-scripts` skips postinstall; fetch the toolchain explicitly (incl. neko).
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Run budgets (determinism + bounded)
        run: npm run ci:budgets

  smoke-min-toolchain:
    name: Smoke (minimum toolchain)
    runs-on: ubuntu-latest
    needs: [guards]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Erlang/Elixir (minimum supported)
        uses: erlef/setup-beam@v1
        with:
          otp-version: '25'
          elixir-version: '1.14'
      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.mix
            ~/.hex
            deps
            _build
          key: ${{ runner.os }}-mix-min-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-min-
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          # `npm ci --ignore-scripts` skips postinstall; fetch the toolchain explicitly (incl. neko).
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Run quick snapshot suite
        run: npm run test:quick
      - name: Runtime smoke (stdlib IO)
        run: bash scripts/ci/runtime-smoke-stdlib-io.sh
      - name: Run Mix tests (fast)
        run: npm run test:mix-fast

  smoke-macos:
    name: Smoke (macOS)
    runs-on: macos-latest
    needs: [guards]
    # macos-latest can have long queue times; keep this job bounded but avoid spurious cancellations.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.mix
            ~/.hex
            deps
            _build
          key: ${{ runner.os }}-mix-macos-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-macos-
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          # `npm ci --ignore-scripts` skips postinstall; fetch the toolchain explicitly (incl. neko).
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Run quick snapshot suite
        run: npm run test:quick
      - name: Run Mix tests (fast)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "[ci] Mix tests attempt ${attempt}/3"
            if npm run test:mix-fast; then
              exit 0
            fi
            echo "[ci] Mix tests failed; retrying in 5s..."
            sleep 5
          done
          echo "[ci] Mix tests failed after 3 attempts"
          exit 1

  docs-smoke:
    name: Docs Smoke (Phoenix)
    runs-on: ubuntu-latest
    needs: [guards]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@v4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-${{ env.HAXE_VERSION }}-
      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "${{ env.HAXE_VERSION }}"
          npx lix use haxe "${{ env.HAXE_VERSION }}"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version
      - name: Download Haxe libraries (lix)
        run: npx lix download
      - name: Run docs smoke (bounded)
        run: |
          set -euo pipefail
          bash scripts/ci/docs-smoke.sh --verbose

  # NOTE: Releases are handled by `.github/workflows/release.yml` (workflow_run + workflow_dispatch)
  # to keep CI read-only and avoid double-running semantic-release.
