name: QA Sentinel Smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_app_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d todo_app_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            examples/todo-app/package-lock.json

      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '27.2'
          elixir-version: '1.18.3'

      - name: Cache mix deps
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.mix
            ~/.hex
            examples/todo-app/deps
            examples/todo-app/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('examples/todo-app/mix.lock') }}

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-4.3.7-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json', 'examples/todo-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-4.3.7-

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "4.3.7"
          npx lix use haxe "4.3.7"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Verify JS client classpath (no repo std/src)
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd examples/todo-app
          haxe -v build-client.hxml 2>&1 | tee classpath.log
          echo '--- Classpath line ---'
          grep '^Classpath:' classpath.log || true
          echo '--- Guard: ensure no repo std/src paths present ---'
          if grep -F "$WORKSPACE/std/" classpath.log; then echo "ERROR: repo std/ found in client classpath"; exit 1; fi
          if grep -F "$WORKSPACE/src/" classpath.log; then echo "ERROR: repo src/ found in client classpath"; exit 1; fi
          echo '--- Guard: ensure build-client.hxml does not add repo classpaths ---'
          if grep -E '^-cp\\s+\\.\\./\\.\\./(std|src)(/|\\s*$)' build-client.hxml; then
            echo "ERROR: build-client.hxml adds repo std/src via -cp ../../.."
            exit 1
          fi
          if grep -E '^-cp\\s+.*vendor/genes/src(/|\\s*$)' build-client.hxml; then
            echo "ERROR: build-client.hxml adds vendor/genes/src directly; use -lib genes"
            exit 1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('examples/todo-app/package-lock.json') }}

      - name: Install Playwright browsers (cached)
        run: |
          npm -C examples/todo-app ci --prefer-offline --no-audit --no-fund
          npx -C examples/todo-app playwright install chromium

      - name: Run QA Sentinel smoke (bounded)
        env:
          MIX_ENV: e2e
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGPORT: '5432'
        run: |
          set -euo pipefail
          scripts/qa-sentinel.sh --app examples/todo-app --port 4001 --compile-migrations --playwright --e2e-spec "e2e/smoke/*.spec.ts" --e2e-workers 1 --deadline 900 --verbose | tee qa-run.log

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-logs
          path: |
            /tmp/qa-*.log
            qa-run.log

  todo-app-mix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d todo_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            examples/todo-app/package-lock.json

      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '27.2'
          elixir-version: '1.18.3'

      - name: Cache mix deps
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.mix
            ~/.hex
            examples/todo-app/deps
            examples/todo-app/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('examples/todo-app/mix.lock') }}

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-4.3.7-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json', 'examples/todo-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-4.3.7-

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "4.3.7"
          npx lix use haxe "4.3.7"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Run todo-app mix test (bounded)
        env:
          MIX_ENV: test
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGPORT: '5432'
        run: |
          set -euo pipefail
          scripts/with-timeout.sh --secs 300 --cwd examples/todo-app -- mix deps.get
          scripts/with-timeout.sh --secs 1800 --cwd examples/todo-app -- mix test 2>&1 | tee todo-app-mix-test.log

      - name: Upload todo-app mix test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: todo-app-mix-test-logs
          path: |
            todo-app-mix-test.log

  smoke-phoenix-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            examples/12-phoenix-chat/package-lock.json

      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '27.2'
          elixir-version: '1.18.3'

      - name: Cache mix deps
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.mix
            ~/.hex
            examples/12-phoenix-chat/deps
            examples/12-phoenix-chat/_build
          key: ${{ runner.os }}-mix-phoenix-chat-${{ hashFiles('examples/12-phoenix-chat/mix.lock') }}

      - name: Cache Haxe toolchain (lix)
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/haxe
          key: ${{ runner.os }}-lix-haxe-4.3.7-${{ hashFiles('.haxerc', 'haxe_libraries/*.hxml', 'package-lock.json', 'examples/12-phoenix-chat/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-lix-haxe-4.3.7-

      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe (pinned via lix)
        run: |
          set -euo pipefail
          npx lix download
          npx lix download haxe "4.3.7"
          npx lix use haxe "4.3.7"
          echo "$(pwd)/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          haxe -version

      - name: Download Haxe libraries (lix)
        run: npx lix download

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-phoenix-chat-${{ hashFiles('examples/12-phoenix-chat/package-lock.json') }}

      - name: Install Playwright browsers (cached)
        run: |
          npm -C examples/12-phoenix-chat ci --prefer-offline --no-audit --no-fund
          npx -C examples/12-phoenix-chat playwright install chromium

      - name: Verify Phoenix chat frontend and generated bindings
        run: |
          npm -C examples/12-phoenix-chat run bind:live-react:check
          npm -C examples/12-phoenix-chat run test:binding
          npm -C examples/12-phoenix-chat run test:crema-tokens
          npm -C examples/12-phoenix-chat run typecheck
          npm -C examples/12-phoenix-chat run test:frontend

      - name: Run Phoenix chat QA Sentinel smoke (bounded)
        run: |
          set -euo pipefail
          scripts/qa-sentinel.sh --app examples/12-phoenix-chat --port 4012 --playwright --e2e-spec "e2e/presence.spec.ts" --e2e-workers 1 --deadline 900 --verbose | tee qa-chat-run.log

      - name: Upload Phoenix chat QA logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-logs-phoenix-chat
          path: |
            /tmp/qa-*.log
            qa-chat-run.log
