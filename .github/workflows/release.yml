name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  HAXE_VERSION: "4.3.7"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Resolve release context
        id: release_context
        run: |
          set -euo pipefail

          event_name="${GITHUB_EVENT_NAME}"
          target_sha="${GITHUB_SHA}"
          should_skip="false"

          if [ "${event_name}" = "workflow_run" ]; then
            target_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
            workflow_conclusion="$(jq -r '.workflow_run.conclusion // empty' "$GITHUB_EVENT_PATH")"
            workflow_message="$(jq -r '.workflow_run.head_commit.message // empty' "$GITHUB_EVENT_PATH")"

            if [ "${workflow_conclusion}" != "success" ]; then
              should_skip="true"
            fi

            if [[ "${workflow_message}" == *"chore(release):"* ]]; then
              should_skip="true"
            fi
          elif [ "${event_name}" != "workflow_dispatch" ]; then
            should_skip="true"
          fi

          if [ -z "${target_sha}" ]; then
            target_sha="${GITHUB_SHA}"
          fi

          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"
          echo "should_skip=${should_skip}" >> "$GITHUB_OUTPUT"
          echo "[release] event=${event_name} target_sha=${target_sha} skip=${should_skip}"

      - name: Skip notice
        if: steps.release_context.outputs.should_skip == 'true'
        run: echo "[release] Skipping release for this trigger."

      - name: Checkout
        if: steps.release_context.outputs.should_skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release_context.outputs.target_sha }}
          token: ${{ github.token }}

      - name: "Guard: reachable semver baseline tag"
        if: steps.release_context.outputs.should_skip != 'true'
        run: |
          set -euo pipefail

          semver_tags="$(git tag --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || true)"

          if [ -z "$semver_tags" ]; then
            echo "::error::No semver tag is reachable from current main history."
            echo "::error::semantic-release would treat this as an initial release (typically 1.0.0)."
            echo "::error::Create/push a baseline tag on main ancestry (for example: v0.1.0)."
            exit 1
          fi

          echo "[release] Reachable semver tags (latest 5):"
          echo "$semver_tags" | sort -V | tail -n 5

      - name: Gate on required workflows (same SHA)
        if: steps.release_context.outputs.should_skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release_context.outputs.target_sha }}
          REQUIRED_WORKFLOWS: >-
            dogfood.yml:Dogfood (Generated Phoenix App),
            sentinel.yml:QA Sentinel Smoke,
            examples.yml:Example Compilation Tests
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          sha="${SHA}"
          api="https://api.github.com/repos/${repo}"
          deadline_secs=900
          interval_secs=15

          echo "[release] Gate: require workflows success for ${sha}"

          IFS=',' read -r -a required <<< "${REQUIRED_WORKFLOWS}"

          start=$SECONDS
          while true; do
            pending=0
            failed=0

            for entry in "${required[@]}"; do
              entry="$(echo "$entry" | xargs)"
              wf_file="${entry%%:*}"
              wf_name="${entry#*:}"

              runs_json="$(curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api}/actions/workflows/${wf_file}/runs?branch=main&per_page=20")"

              run_json="$(echo "$runs_json" | jq -c --arg sha "$sha" \
                '.workflow_runs[] | select(.head_sha == $sha) | {status, conclusion, html_url} ' \
                | head -n 1 || true)"

              if [ -z "$run_json" ]; then
                echo "[release]   - ${wf_name}: not found yet"
                pending=1
                continue
              fi

              status="$(echo "$run_json" | jq -r '.status')"
              conclusion="$(echo "$run_json" | jq -r '.conclusion')"
              url="$(echo "$run_json" | jq -r '.html_url')"

              if [ "$status" != "completed" ]; then
                echo "[release]   - ${wf_name}: ${status} (${url})"
                pending=1
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                echo "[release]   - ${wf_name}: ${conclusion} (${url})"
                failed=1
                continue
              fi

              echo "[release]   - ${wf_name}: success"
            done

            if [ $failed -eq 1 ]; then
              echo "[release] Gate failed: required workflows did not succeed."
              exit 1
            fi

            if [ $pending -eq 0 ]; then
              echo "[release] Gate passed."
              break
            fi

            elapsed=$((SECONDS - start))
            if [ $elapsed -ge $deadline_secs ]; then
              echo "[release] Gate timeout after ${deadline_secs}s waiting for required workflows."
              exit 1
            fi

            sleep "${interval_secs}"
          done

      - name: Setup Node.js
        if: steps.release_context.outputs.should_skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install npm dependencies
        if: steps.release_context.outputs.should_skip != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Haxe for Reflaxe package build
        if: steps.release_context.outputs.should_skip != 'true'
        run: |
          set -euo pipefail
          npx lix download haxe "${HAXE_VERSION}"
          npx lix use haxe "${HAXE_VERSION}"
          haxe_bin="$HOME/haxe/versions/${HAXE_VERSION}/haxe"
          test -x "$haxe_bin"
          "$haxe_bin" -version
          echo "HAXE_BIN=$haxe_bin" >> "$GITHUB_ENV"

      - name: Configure git identity (for release commits)
        if: steps.release_context.outputs.should_skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        if: steps.release_context.outputs.should_skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "[release] Publishing (semantic-release decides whether a new version is required)"
          npx semantic-release

      - name: Verify published Reflaxe package
        if: steps.release_context.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/release/verify-published-package.sh
